name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and package Windows installers
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand public-safe source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path "Universal-CAD-Desktop-v0.26.0-public-source.zip" -DestinationPath src -Force
          if (-not (Test-Path "src/package.json")) { throw "Source archive did not expand correctly." }

      - name: Fix electron-builder application root
        shell: pwsh
        run: |
          $configs = @(
            "src/electron-builder.customer.yml",
            "src/electron-builder.manager.yml"
          )
          foreach ($config in $configs) {
            $text = Get-Content $config -Raw
            if ($text -notmatch '(?m)^  app: \.$') {
              $text = $text -replace '(?m)^directories:\r?\n', "directories:`r`n  app: .`r`n"
              Set-Content -Path $config -Value $text -NoNewline
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop build dependencies
        working-directory: src
        run: npm install

      - name: Run license, public-package, and PWA regression tests
        working-directory: src
        run: npm test

      - name: Build customer and license-manager installers
        working-directory: src
        run: npm run build:windows

      - name: Verify installer outputs and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          $customer = Get-ChildItem "src/release/customer" -Filter *.exe -File -ErrorAction Stop
          $manager  = Get-ChildItem "src/release/license-manager" -Filter *.exe -File -ErrorAction Stop
          if ($customer.Count -lt 1) { throw "Customer installer was not produced." }
          if ($manager.Count -lt 1)  { throw "License Manager installer was not produced." }
          Copy-Item $customer.FullName release-bundle/
          Copy-Item $manager.FullName release-bundle/
          Remove-Item release-bundle/SHA256SUMS.txt -ErrorAction SilentlyContinue
          Get-ChildItem release-bundle/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content release-bundle/SHA256SUMS.txt
            Write-Host "$($_.Name) [$($_.Length) bytes] SHA256=$hash"
          }

      - name: Upload Windows installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-CAD-Desktop-v0.26.0-Windows
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh v0.26.0 GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v0.26.0"
          $files = Get-ChildItem release-bundle -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target "$env:GITHUB_SHA" --title "Universal CAD Desktop v0.26.0" --notes "Windows desktop release with machine-bound offline licensing. The signing master key is intentionally not stored in this repository or release."
          }

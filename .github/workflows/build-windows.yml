name: Build Universal CAD Suite Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and package Suite
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Suite v1.0.5 from verified layers
        shell: pwsh
        run: |
          $base = "Universal-CAD-Suite-v1.0.0-public-source.zip"
          if (-not (Test-Path $base)) { throw "Required v1.0.0 baseline source was not found." }

          Remove-Item src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path $base -DestinationPath src -Force

          $parts = Get-ChildItem ".github/replacements/v1.0.3/chunks/part-*.txt" -File | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Suite v1.0.3 replacement bundle is incomplete." }
          $b64 = ($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join ''
          $v103Zip = Join-Path $env:RUNNER_TEMP "v1.0.3-replacements.zip"
          [System.IO.File]::WriteAllBytes($v103Zip, [Convert]::FromBase64String($b64))
          $v103Expected = "8b2c63f8aee6fab134d1a5b9f31bbfef658176c1d46f5cedf2e7d442e549233a"
          $v103Actual = (Get-FileHash $v103Zip -Algorithm SHA256).Hash.ToLower()
          if ($v103Actual -ne $v103Expected) { throw "v1.0.3 replacement SHA-256 mismatch." }
          Expand-Archive -Path $v103Zip -DestinationPath src -Force

          $v104Root = ".github/replacements/v1.0.4/files"
          $v104Files = @(
            "desktop/machine-id.cjs",
            "desktop/license-service.cjs",
            "customer-license-tool/host-identity.cjs",
            "customer-license-tool/main.cjs",
            "tests/test-v103-regression.cjs",
            "tests/test-v104-machine-id.cjs"
          )
          foreach ($rel in $v104Files) {
            $source = Join-Path $v104Root $rel
            $target = Join-Path "src" $rel
            if (-not (Test-Path $source)) { throw "Missing v1.0.4 replacement: $rel" }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item $source $target -Force
          }

          $v104VersionFiles = @(
            "src/package.json","src/BUILD-WINDOWS.cmd","src/desktop/main.cjs","src/desktop/activation.html",
            "src/desktop/activation.js","src/desktop/feature-gate.cjs","src/desktop/preload.cjs",
            "src/customer-license-tool/ui/index.html","src/master-license-manager/ui/index.html","src/license-core/feature-catalog.cjs"
          )
          foreach ($file in $v104VersionFiles) {
            $text = [System.IO.File]::ReadAllText((Resolve-Path $file))
            [System.IO.File]::WriteAllText((Resolve-Path $file), $text.Replace('1.0.3','1.0.4'), [System.Text.UTF8Encoding]::new($false))
          }

          $v105Root = ".github/replacements/v1.0.5/files"
          $v105Files = @(
            "desktop/preload.cjs",
            "desktop/main.cjs",
            "desktop/activation.js",
            "package.json",
            "tests/test-v105-preload.cjs"
          )
          foreach ($rel in $v105Files) {
            $source = Join-Path $v105Root $rel
            $target = Join-Path "src" $rel
            if (-not (Test-Path $source)) { throw "Missing v1.0.5 replacement: $rel" }
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item $source $target -Force
          }

          $v105VersionFiles = @(
            "src/BUILD-WINDOWS.cmd","src/desktop/activation.html","src/desktop/feature-gate.cjs",
            "src/customer-license-tool/main.cjs","src/customer-license-tool/ui/index.html",
            "src/master-license-manager/ui/index.html","src/license-core/feature-catalog.cjs"
          )
          foreach ($file in $v105VersionFiles) {
            $text = [System.IO.File]::ReadAllText((Resolve-Path $file))
            [System.IO.File]::WriteAllText((Resolve-Path $file), $text.Replace('1.0.4','1.0.5'), [System.Text.UTF8Encoding]::new($false))
          }

          $suite = Get-Content "src/package.json" -Raw | ConvertFrom-Json
          $engine = Get-Content "src/app/package.json" -Raw | ConvertFrom-Json
          $version = [string]$suite.version
          $engineVersion = [string]$engine.version
          if ($version -ne "1.0.5") { throw "Expected Suite 1.0.5, got $version." }
          if ($engineVersion -ne "0.26.0") { throw "Expected Engine 0.26.0, got $engineVersion." }

          $preload = Get-Content "src/desktop/preload.cjs" -Raw
          $main = Get-Content "src/desktop/main.cjs" -Raw
          $activation = Get-Content "src/desktop/activation.js" -Raw
          if ($preload -match "require\('./feature-gate\.cjs'\)") { throw "Sandboxed preload still requires local CommonJS." }
          if ($preload -notmatch "license:machine-id") { throw "Direct Machine ID preload bridge missing." }
          if ($main -notmatch "ipcMain\.handle\('license:machine-id'") { throw "Direct Machine ID IPC handler missing." }
          if ($activation -notmatch "Promise\.allSettled") { throw "Activation isolation for Machine ID is missing." }
          if (-not (Test-Path "src/tests/test-v105-preload.cjs")) { throw "v1.0.5 preload regression test missing." }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_VERSION=$engineVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=suite-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Suite v$version / Engine v$engineVersion reconstructed successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Run full validation gate
        working-directory: src
        run: npm run test:full

      - name: Run v1.0.5 preload runtime test
        working-directory: src
        run: npm run test:preload

      - name: Build 3 Windows installers
        working-directory: src
        run: npm run build:windows

      - name: Verify installers and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          $studio = "src/release/studio/Universal-CAD-Studio-Setup-$env:VERSION-x64.exe"
          $customerTool = "src/release/customer-license-tool/Universal-CAD-Customer-License-Tool-Setup-$env:VERSION-x64.exe"
          $masterManager = "src/release/master-license-manager/Universal-CAD-Master-License-Manager-Setup-$env:VERSION-x64.exe"
          foreach ($file in @($studio, $customerTool, $masterManager)) {
            if (-not (Test-Path $file)) { throw "Required installer was not produced: $file" }
            Copy-Item $file release-bundle/
          }
          Remove-Item "release-bundle/SHA256SUMS.txt" -ErrorAction SilentlyContinue
          Get-ChildItem "release-bundle/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "release-bundle/SHA256SUMS.txt"
            Write-Host "$($_.Name) [$($_.Length) bytes] SHA256=$hash"
          }

      - name: Upload Suite artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-CAD-Suite-v${{ env.VERSION }}-Windows
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $title = "Universal CAD Suite v$env:VERSION"
          $notes = "Universal CAD Suite v$env:VERSION · Engine v$env:ENGINE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "$title" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
          } else {
            gh release edit $tag --title "$title" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update GitHub Release metadata." }
          }
          Start-Sleep -Seconds 3
          foreach ($file in (Get-ChildItem "release-bundle" -File | Sort-Object Name)) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              gh release upload $tag "$($file.FullName)" --clobber
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $uploaded) { throw "Failed to upload release asset: $($file.Name)" }
            Start-Sleep -Seconds 2
          }
          gh release view $tag --json url --jq .url

      - name: Final release summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Suite Version : $env:VERSION"
          Write-Host "Engine Version: $env:ENGINE_VERSION"
          Write-Host "Release Tag   : $env:TAG"
          if (Test-Path "release-bundle") {
            Get-ChildItem "release-bundle" -File | Sort-Object Name | ForEach-Object { Write-Host "$($_.Name) [$($_.Length) bytes]" }
          }

name: Build Universal CAD Suite Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and package Suite
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Suite v1.0.3 from v1.0.0 baseline
        shell: pwsh
        run: |
          $base = "Universal-CAD-Suite-v1.0.0-public-source.zip"
          if (-not (Test-Path $base)) { throw "Required v1.0.0 baseline source was not found." }

          Remove-Item src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path $base -DestinationPath src -Force

          $parts = Get-ChildItem ".github/patches/v1.0.3/patch-*.txt" -File | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Suite v1.0.3 patch is incomplete. Expected 9 parts, found $($parts.Count)." }

          $patch = Join-Path $env:RUNNER_TEMP "suite-v1.0.3.patch"
          $patchText = ($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join ''
          [System.IO.File]::WriteAllText($patch, $patchText, [System.Text.UTF8Encoding]::new($false))

          Push-Location src
          git init | Out-Null
          git config core.autocrlf false
          git config core.safecrlf false
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "Suite v1.0.3 patch validation failed." }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "Suite v1.0.3 patch application failed." }
          Pop-Location
          Remove-Item "src/.git" -Recurse -Force -ErrorAction SilentlyContinue

          $suite = Get-Content "src/package.json" -Raw | ConvertFrom-Json
          $engine = Get-Content "src/app/package.json" -Raw | ConvertFrom-Json
          $version = [string]$suite.version
          $engineVersion = [string]$engine.version

          if ($version -ne "1.0.3") { throw "Expected Suite 1.0.3 after patch, got $version." }
          if ($engineVersion -ne "0.26.0") { throw "Expected Engine 0.26.0, got $engineVersion." }
          if (-not (Test-Path "src/tests/test-v103-regression.cjs")) { throw "v1.0.3 regression test was not reconstructed." }
          if (-not ((Get-Content "src/master-license-manager/preload.cjs" -Raw) -match 'removeKey')) { throw "Remove Master Key bridge is missing after reconstruction." }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_VERSION=$engineVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=suite-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Suite v$version / Engine v$engineVersion reconstructed from verified v1.0.0 baseline."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        working-directory: src
        run: npm install

      - name: Run full validation gate
        working-directory: src
        run: npm run test:full

      - name: Build 3 Windows installers
        working-directory: src
        run: npm run build:windows

      - name: Verify installers and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          $studio = "src/release/studio/Universal-CAD-Studio-Setup-$env:VERSION-x64.exe"
          $customerTool = "src/release/customer-license-tool/Universal-CAD-Customer-License-Tool-Setup-$env:VERSION-x64.exe"
          $masterManager = "src/release/master-license-manager/Universal-CAD-Master-License-Manager-Setup-$env:VERSION-x64.exe"
          foreach ($file in @($studio, $customerTool, $masterManager)) {
            if (-not (Test-Path $file)) { throw "Required installer was not produced: $file" }
            Copy-Item $file release-bundle/
          }
          Remove-Item "release-bundle/SHA256SUMS.txt" -ErrorAction SilentlyContinue
          Get-ChildItem "release-bundle/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "release-bundle/SHA256SUMS.txt"
            Write-Host "$($_.Name) [$($_.Length) bytes] SHA256=$hash"
          }

      - name: Upload Suite artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-CAD-Suite-v${{ env.VERSION }}-Windows
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $title = "Universal CAD Suite v$env:VERSION"
          $notes = "Universal CAD Suite v$env:VERSION · Engine v$env:ENGINE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "$title" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
          } else {
            gh release edit $tag --title "$title" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update GitHub Release metadata." }
          }
          Start-Sleep -Seconds 3
          $files = Get-ChildItem "release-bundle" -File | Sort-Object Name
          foreach ($file in $files) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              Write-Host "Uploading $($file.Name), attempt $attempt/4"
              gh release upload $tag "$($file.FullName)" --clobber
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $uploaded) { throw "Failed to upload release asset after retries: $($file.Name)" }
            Start-Sleep -Seconds 2
          }
          gh release view $tag --json url --jq .url

      - name: Final release summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Suite Version : $env:VERSION"
          Write-Host "Engine Version: $env:ENGINE_VERSION"
          Write-Host "Release Tag   : $env:TAG"
          if (Test-Path "release-bundle") {
            Get-ChildItem "release-bundle" -File | Sort-Object Name | ForEach-Object { Write-Host "$($_.Name) [$($_.Length) bytes]" }
          }
